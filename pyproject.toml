[project]
name = "planning-gardes-psy"
version = "0.1.0"
description = "Prototype de planification des gardes psychiatriques (données fictives)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
